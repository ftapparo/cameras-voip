<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste WebSocket Camera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            padding: 20px;
        }
        .camera-container {
            margin: 20px 0;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 10px;
            background: #111;
        }
        .camera-title {
            margin-bottom: 10px;
            font-weight: bold;
            color: #4CAF50;
        }
        .camera-image {
            width: 400px;
            height: 300px;
            border: 1px solid #666;
            background: #000;
            object-fit: cover;
        }
        .status {
            margin: 10px 0;
            font-size: 14px;
        }
        .connected { color: #4CAF50; }
        .error { color: #F44336; }
        .connecting { color: #FFC107; }
    </style>
</head>
<body>
    <h1>🔴 Teste WebSocket Camera Streaming</h1>
    
    <div class="camera-container">
        <div class="camera-title">Câmera 1 - Entrada Principal (IP: 192.168.0.103)</div>
        <img id="camera1" class="camera-image" alt="Camera 1" />
        <div id="status1" class="status connecting">🔄 Conectando...</div>
        <div id="debug1" class="status">Debug: Aguardando conexão</div>
    </div>

    <script>
        class WebSocketCameraTest {
            constructor(cameraId, imgElementId, statusElementId, debugElementId) {
                this.cameraId = cameraId;
                this.img = document.getElementById(imgElementId);
                this.status = document.getElementById(statusElementId);
                this.debug = document.getElementById(debugElementId);
                this.ws = null;
                this.frameCount = 0;
                this.startTime = Date.now();
                
                this.connect();
            }
            
            connect() {
                try {
                    const wsUrl = `ws://localhost:3001/?camera=${this.cameraId}`;
                    console.log(`Conectando em: ${wsUrl}`);
                    
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log(`✅ WebSocket conectado para câmera ${this.cameraId}`);
                        this.updateStatus('🔴 CONECTADO', 'connected');
                        this.updateDebug('Aguardando frames...');
                    };
                    
                    this.ws.onclose = () => {
                        console.log(`❌ WebSocket desconectado para câmera ${this.cameraId}`);
                        this.updateStatus('⭕ DESCONECTADO', 'error');
                        this.updateDebug('Conexão perdida. Tentando reconectar...');
                        
                        // Reconecta após 3 segundos
                        setTimeout(() => this.connect(), 3000);
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error(`❌ Erro WebSocket:`, error);
                        this.updateStatus('❌ ERRO', 'error');
                        this.updateDebug(`Erro: ${error.message || 'Falha na conexão'}`);
                    };
                    
                    this.ws.onmessage = async (event) => {
                        try {
                            // Mensagem JSON (metadata)
                            if (typeof event.data === 'string') {
                                const message = JSON.parse(event.data);
                                console.log(`📨 Mensagem recebida:`, message);
                                
                                if (message.type === 'connected') {
                                    this.updateDebug(`Stream iniciado para câmera ${this.cameraId}`);
                                } else if (message.type === 'error') {
                                    this.updateStatus('❌ ERRO SERVER', 'error');
                                    this.updateDebug(`Erro servidor: ${message.message}`);
                                } else if (message.type === 'frame') {
                                    this.frameCount++;
                                    const fps = (this.frameCount / (Date.now() - this.startTime) * 1000).toFixed(1);
                                    this.updateDebug(`Frame ${this.frameCount} | FPS: ${fps} | ${new Date(message.timestamp).toLocaleTimeString()}`);
                                }
                            }
                            // Frame binário (ArrayBuffer)
                            else if (event.data instanceof ArrayBuffer) {
                                console.log(`🖼️ Frame recebido: ${event.data.byteLength} bytes`);
                                
                                const blob = new Blob([event.data], { type: 'image/jpeg' });
                                const imageUrl = URL.createObjectURL(blob);
                                
                                // Libera URL anterior
                                if (this.img.src.startsWith('blob:')) {
                                    URL.revokeObjectURL(this.img.src);
                                }
                                
                                // Atualiza imagem
                                this.img.src = imageUrl;
                                
                                this.updateStatus('🔴 STREAMING', 'connected');
                            }
                            // Blob (caso venha como blob)
                            else if (event.data instanceof Blob) {
                                console.log(`🖼️ Frame blob recebido: ${event.data.size} bytes`);
                                
                                const imageUrl = URL.createObjectURL(event.data);
                                
                                // Libera URL anterior
                                if (this.img.src.startsWith('blob:')) {
                                    URL.revokeObjectURL(this.img.src);
                                }
                                
                                // Atualiza imagem
                                this.img.src = imageUrl;
                                
                                this.updateStatus('🔴 STREAMING', 'connected');
                            }
                        } catch (error) {
                            console.error(`❌ Erro ao processar mensagem:`, error);
                            this.updateDebug(`Erro processamento: ${error.message}`);
                        }
                    };
                    
                } catch (error) {
                    console.error(`❌ Erro ao criar WebSocket:`, error);
                    this.updateStatus('❌ FALHA CONEXÃO', 'error');
                    this.updateDebug(`Falha: ${error.message}`);
                }
            }
            
            updateStatus(text, className) {
                this.status.textContent = text;
                this.status.className = `status ${className}`;
            }
            
            updateDebug(text) {
                this.debug.textContent = `Debug: ${text}`;
            }
            
            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }
        }
        
        // Testa câmera 103 (primeira câmera)
        const camera1Test = new WebSocketCameraTest('103', 'camera1', 'status1', 'debug1');
        
        // Cleanup ao fechar página
        window.addEventListener('beforeunload', () => {
            camera1Test.disconnect();
        });
        
        console.log('🎯 Teste WebSocket iniciado para câmera 103');
    </script>
</body>
</html>
